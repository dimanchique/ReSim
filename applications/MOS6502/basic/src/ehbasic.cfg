MEMORY {
    ZP:       start = $0000, size = $0100, type = rw, fill = yes;
    RAM:      start = $0100, size = $BF00, type = rw, fill = yes;
    BASIC:    start = $C000, size = $3F80, type = ro, fill = yes;
    MONITOR:  start = $FF80, size = $007A, type = ro, fill = yes;
    VECT:     start = $FFFA, size = $06, type = ro, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = BASIC, start = $C000, type = ro;
    MONITOR:  load = MONITOR, start = $FF80, type = ro;
    VECTORS:  load = VECT, start = $FFFA, type = ro;
}
